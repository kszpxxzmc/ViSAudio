name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Check supported code
        run: |
          ruff check --select E9,F63,F7,F82 demo.py batch_eval.py train.py training/extract_video_training_latents.py visaudio tests
          bash -n run.sh
          bash -n train.sh
          bash -n eval.sh
          bash -n extract.sh
      - name: Test
        env:
          OMP_NUM_THREADS: "2"
          MPLBACKEND: Agg
        run: python -m pytest
      - name: Build
        run: python -m build

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.yapf]
based_on_style = "pep8"
indent_width = 4
column_limit = 100

[tool.isort]
line_length = 100

[project]
name = "visaudio"
version = "1.0.0"
authors = [{ name = "Mengchen Zhang", email = "zhangmengchen@zju.edu.cn" }]
description = "ViSAudio generates binaural spatial audio given video and/or text inputs"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  'torch == 2.5.1',
  'torchvision == 0.20.1',
  'torchaudio == 2.5.1',
  'huggingface_hub >= 0.26',
  'gitpython >= 3.1',
  'tensorboard >= 2.11',
  'numpy >= 1.21, <2.1',
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'scipy >= 1.7',
  'tqdm >= 4.66.1',
  'einops >= 0.6',
  'hydra-core >= 1.3.2',
  'requests',
  'torchdiffeq >= 0.2.5',
  'librosa >= 0.8.1',
  'nitrous-ema',
  'hydra_colorlog',
  'colorlog',
  'open_clip_torch >= 2.29.0',
  'av >= 14.0.1',
  'timm >= 1.0.12',
  'python-dotenv',
  'pandas >= 2.0',
  'matplotlib >= 3.7',
  'soundfile >= 0.12',
  'pytz',
]

[project.optional-dependencies]
dev = ['pytest >= 8', 'build', 'ruff']

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["visaudio"]

[tool.hatch.build.targets.sdist]
include = [
  "/visaudio", "/config", "/training", "/tests", "/assets", "/dataset",
  "/README.md", "/LICENSE", "/pyproject.toml",
  "/demo.py", "/demo_batch.py", "/prepare_assets.py",
  "/batch_eval.py", "/train.py", "/*.sh",
]
exclude = ["*.pt", "*.pth", "*.ckpt", "*.safetensors", "training/*/feature",
           "training/*/memmap", "*.local.conf"]
